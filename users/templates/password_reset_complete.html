{% extends 'ecom/base.html' %}

{% block title %}Password Reset Complete - ShopMate{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <div class="text-5xl mb-4">✅</div>
            <h1 class="auth-header__title">Password reset complete</h1>
            <p class="auth-header__subtitle">
                Your password has been changed. You can now log in with your new password.
            </p>
        </div>

        <a href="{% url 'users:login' %}" class="auth-submit block text-center">
            Log In
        </a>

    </div>
</div>
{% endblock %}
